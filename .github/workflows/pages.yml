name: deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# the workflow needs to mint the deployment token; nothing else
permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, and never cancel one that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc -b && vite build; base is './' so the site works from /Momo-S1/ as well as /
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
